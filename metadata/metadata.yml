name: Characterizing the visual representation of objects from the child’s view
description: |-
  # Characterizing the visual representation of objects from the child’s view

  Computational reproducibility capsule for the *BabyView Objects* manuscript (2026).

  ## Links

  - GitHub: https://github.com/babyview-project/babyview-objects-manuscript
  - Code Ocean provisional DOI (under review; may not resolve publicly until accepted): https://doi.org/10.24433/CO.0860553.v1
  - Code license: MIT; anonymized data: CC0 1.0

  ## What this capsule provides

  - Analysis code under `code/manuscript-2026/`
  - Anonymized intermediate tables under `data/shared_data_manuscript_2026/` (demo dataset)
  - A fixed compute environment for a **Reproducible Run**

  Manuscript embedding analyses use **CLIP** and **DINOv3**.

  ## How to use

  1. Click **Reproducible Run** (entry point: `code/run`).
  2. Inspect `/results` (especially `/results/shared/`).
  3. Compare manuscript statistics to the shipped CSVs.

  Details: [`README.md`](README.md), [`REPRODUCING.md`](REPRODUCING.md), and [`code/manuscript-2026/DATA_AVAILABILITY.md`](code/manuscript-2026/DATA_AVAILABILITY.md).

  ## What a Reproducible Run does

  - Verifies every file listed in `data/shared_data_manuscript_2026/MANIFEST.json`
  - Copies the full anonymized shared tree to `/results/shared/` for the computation snapshot

  Optional: set `RUN_NOTEBOOKS=1` to re-execute notebooks **02**, **03**, and **05** from shipped category-level embeddings.

  ## Scope

  This capsule supports checking manuscript numbers from anonymized intermediates. It does **not** include raw BabyView video, crop paths, or real participant identifiers. Analyses that require those restricted assets are documented but outside the default run.
